<VirtualHost *:80>
    DocumentRoot "/var/www/nextcloud.m2l.asso"
    ServerName nextcloud.m2l.asso

    <Directory "/var/www/nextcloud.m2l.asso/">
        Options MultiViews FollowSymlinks
        AllowOverride All
        Order allow,deny
        Allow from all
   </Directory>

   TransferLog /var/log/apache2/nextcloud.m2l.asso_access.log
   ErrorLog /var/log/apache2/nextcloud.m2l.asso_error.log

</VirtualHost>

<VirtualHost *:443>
   DocumentRoot "/var/www/nextcloud.m2l.asso"
   ServerName nextcloud.m2l.asso

   SSLEngine on
   SSLCertificateFile /etc/ssl/certs/nextcloud.m2l.asso.crt
   SSLCertificateKeyFile /etc/ssl/private/nextcloud.m2l.asso.key
    <Directory "/var/www/nextcloud.m2l.asso/">
	Options Multiviews FollowSymlinks
	AllowOverride All
	Order allow,deny
	Allow from all
   </Directory>

	TransferLog /var/log/apache2/nextcloud.m2l.asso_access.log
	ErrorLog /var/log/apache2/nextcloud.m2l.asso_error.log

</VirtualHost>  
