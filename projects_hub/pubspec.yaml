name: projects_hub
description: "Mes Projets - tous mes projets (GitHub, dossiers locaux, sites) réunis dans une appli Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  archive: ^4.3.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/builtin/fondu_musique/
