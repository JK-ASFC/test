<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 500px;
            opacity: 1;
            transition: opacity 1s ease-out;
        }

        .plate_wrapper {
            width: 150px;
            height: 130px;
            margin-bottom: 400px; /* Ajout d'espace sous les éléments */
        }

        .plate_wrapper span {
            background: #1184D1;
            display: inline-block;
            width: 50%;
            height: 50%;
            
        }

        .plate_wrapper span:nth-child(odd) {
            border-right: 4px solid #000000;

        }

        .spinner {
            box-sizing: border-box;
            width: 60px;
            height: 60px;
            padding: 3px;
            overflow: visible;
            color: #ffffff; /* Couleur blanche pour la roue */
        }

        .spinner > circle {
            fill: none;
            stroke: currentColor;
            cx: 50%;
            cy: 50%;
            r: 50%;
            stroke-width: 6px;
            stroke-linecap: round;
            transform-origin: center;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="plate_wrapper">
        <span></span><span></span><span></span><span></span>
    </div>
    <svg class="spinner">
        <circle>
            <animateTransform attributeName="transform" type="rotate" values="-90;810" keyTimes="0;1" dur="2s" repeatCount="indefinite"></animateTransform>
            <animate attributeName="stroke-dashoffset" values="0%;0%;-157.080%" calcMode="spline" keySplines="0.61, 1, 0.88, 1; 0.12, 0, 0.39, 0" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite"></animate>
            <animate attributeName="stroke-dasharray" values="0% 314.159%;157.080% 157.080%;0% 314.159%" calcMode="spline" keySplines="0.61, 1, 0.88, 1; 0.12, 0, 0.39, 0" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite"></animate>
        </circle>
    </svg>
    <audio id="startup-sound" src="assets/music/startup.mp3"></audio>
    <script>
        setTimeout(function () {
            document.body.style.opacity = "0"; // Déclencher l'animation de fade-out
        }, 4500); // Commencer le fade-out juste avant la redirection

        setTimeout(function () {
            // Jouer la musique
            document.getElementById("startup-sound").play();
            setTimeout(function () {
                window.location.href = 'start.html'; // Rediriger après la musique
            }, 1000); // Temps pour laisser jouer le son (ajuster si nécessaire)
        }, 6000); // Redirection après le fade-out
    </script>
</body>

</html>
