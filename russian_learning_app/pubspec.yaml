name: russian_learning_app
description: "Apprends le russe de A1 à C1 - cours complets, hors-ligne, gratuits."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Local persistence (progress, streak, XP, settings, spaced repetition) - 100% offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # Audio: pronunciation of Russian words/phrases (device TTS engine, free, offline-capable)
  flutter_tts: ^4.1.0

  # Speaking exercises: on-device speech recognition (free, no API key)
  speech_to_text: ^7.0.0

  # Daily reminder notifications ("do your Russian lesson")
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Small utilities
  intl: ^0.19.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
